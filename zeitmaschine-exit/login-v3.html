<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EXIT Login</title><style>:root{--bg:#0b1020;--card:#171d35;--line:#3b4775;--text:#f7f8ff;--muted:#aeb8d8;--accent:#ffd166;--red:#ff5c70}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#202a52,#080b16 68%);color:var(--text);font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:460px;margin:auto;padding:28px 18px 70px}.hero{text-align:center;padding:25px 0 10px}.hero h1{font-size:2.2rem;margin:.2em 0}.hero p{color:var(--muted);line-height:1.5}.card{background:linear-gradient(180deg,#202846,#151a30);border:1px solid var(--line);border-radius:24px;padding:22px;margin:18px 0;box-shadow:0 20px 60px #0005}.field{width:100%;background:#0b1125;color:white;border:2px solid #435181;border-radius:13px;padding:15px;margin:7px 0;font-size:1rem}.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;margin-top:11px;background:var(--accent);color:#111;font-size:1rem;font-weight:900;text-align:center;text-decoration:none}.secondary{background:#2a345d;color:white}.epoch{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:#70e6ff;font-weight:900}.err{min-height:22px;color:#ff9bab;font-weight:700;margin-top:9px}.ok{color:#9bea73}.divider{text-align:center;color:var(--muted);margin:22px 0}.small{font-size:.85rem;color:var(--muted);line-height:1.45}#register{scroll-margin-top:20px}</style></head><body><main class="wrap"><div class="hero"><div class="epoch">EXIT Online</div><h1>🔐 Spielerprofil</h1><p>Deine Punkte und Fortschritte werden online gespeichert und funktionieren auf mehreren Geräten.</p></div><section class="card" id="login"><h2>Anmelden</h2><form id="loginForm"><input id="loginUser" class="field" autocomplete="username" placeholder="Benutzername" required><input id="loginPass" class="field" type="password" autocomplete="current-password" placeholder="Passwort" required><button class="btn" type="submit">Anmelden</button></form><div id="loginErr" class="err"></div><a class="btn secondary" href="#register">➕ Neu erstellen</a></section><div class="divider">oder</div><section class="card" id="register"><div class="epoch">Neues Profil</div><h2>Profil erstellen</h2><p class="small">Dieser Bereich ist immer direkt erreichbar – ohne JavaScript-Umschaltung.</p><form id="registerForm"><input id="regUser" class="field" autocomplete="username" placeholder="Neuer Benutzername" required><input id="regPass" class="field" type="password" autocomplete="new-password" placeholder="Passwort" required><input id="regPass2" class="field" type="password" autocomplete="new-password" placeholder="Passwort wiederholen" required><button class="btn" type="submit">Profil erstellen</button></form><div id="regErr" class="err"></div><a class="btn secondary" href="#login">↑ Zur Anmeldung</a></section></main><script>(function(){var API='https://sduzfdktpxpigysvbckf.supabase.co/functions/v1/exit-api',TK='exit_token',UK='exit_user';async function call(action,data){var r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({action:action},data||{}))});var j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||'Serverfehler');return j}function done(j){localStorage.setItem(TK,j.token);localStorage.setItem(UK,j.user.username);location.href='online.html?v=20260819-1008'}document.getElementById('loginForm').addEventListener('submit',async function(e){e.preventDefault();var out=document.getElementById('loginErr');out.className='err';out.textContent='Anmeldung wird geprüft …';try{var j=await call('login',{username:document.getElementById('loginUser').value.trim(),password:document.getElementById('loginPass').value});done(j)}catch(x){out.textContent=x.message}});document.getElementById('registerForm').addEventListener('submit',async function(e){e.preventDefault();var out=document.getElementById('regErr'),u=document.getElementById('regUser').value.trim(),p=document.getElementById('regPass').value,p2=document.getElementById('regPass2').value;out.className='err';if(p!==p2){out.textContent='Die Passwörter stimmen nicht überein.';return}out.textContent='Profil wird erstellt …';try{var j=await call('register',{username:u,password:p});out.className='err ok';out.textContent='Profil erstellt! Spiel wird geöffnet …';setTimeout(function(){done(j)},350)}catch(x){out.textContent=x.message}})})();</script></body></html>
