<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EXIT Login</title>
<style>
:root{--bg:#0b1020;--card:#171d35;--text:#f7f8ff;--muted:#aeb8d8;--accent:#ffd166;--line:#3b4775;--red:#ff8fa0;--green:#9bea73}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#202a52,#080b16 68%);color:var(--text);font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(94vw,440px);background:linear-gradient(180deg,#202846,#151a30);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.45)}h1{margin:.2em 0}.small{color:var(--muted);line-height:1.5}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.tabs a{display:block;text-align:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#11172e;font-weight:800;color:white;text-decoration:none}.field{width:100%;background:#0b1125;color:white;border:2px solid #435181;border-radius:13px;padding:14px;margin:7px 0;font-size:1rem}.btn{width:100%;border:0;border-radius:14px;padding:15px;margin-top:10px;font-weight:900;font-size:1rem;background:var(--accent);color:#111}.status{display:none;margin-top:14px;padding:14px;border-radius:12px;font-weight:800;line-height:1.45}.status.wait{display:block;background:#202b4d;border:1px solid #53618f;color:white}.status.bad{display:block;background:#351722;border:1px solid #8a3d55;color:#ffd8e1}.status.ok{display:block;background:#17351f;border:1px solid #4f8a5b;color:#dfffe5}.epoch{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:#70e6ff;font-weight:900}#register{display:none}#register:target{display:block}#register:target~#login{display:none}
</style>
</head>
<body>
<div class="card">
<div class="epoch">EXIT Online</div>
<h1>🔐 Spielerprofil</h1>
<p class="small">Melde dich an oder erstelle ein neues Profil. Dein Punktestand wird online gespeichert.</p>
<div class="tabs"><a href="#login">Anmelden</a><a href="#register">Neu erstellen</a></div>
<section id="register">
<form id="registerForm">
<input id="ru" class="field" placeholder="Neuer Benutzername" autocomplete="username" required>
<input id="rp" class="field" type="password" placeholder="Passwort" autocomplete="new-password" required>
<input id="rp2" class="field" type="password" placeholder="Passwort wiederholen" autocomplete="new-password" required>
<button id="registerBtn" class="btn" type="submit">Profil erstellen</button>
</form>
</section>
<section id="login">
<form id="loginForm">
<input id="lu" class="field" placeholder="Benutzername" autocomplete="username" required>
<input id="lp" class="field" type="password" placeholder="Passwort" autocomplete="current-password" required>
<button id="loginBtn" class="btn" type="submit">Anmelden</button>
</form>
</section>
<div id="status" class="status"></div>
</div>
<script>
(function(){
var API='https://sduzfdktpxpigysvbckf.supabase.co/functions/v1/exit-api';
var TK='exit_token',UK='exit_user';
var st=document.getElementById('status');
function showStatus(text,type){st.className='status '+type;st.textContent=text;st.scrollIntoView({behavior:'smooth',block:'nearest'});}
async function call(action,username,password,button){
  button.disabled=true;var old=button.textContent;button.textContent=action==='login'?'Anmeldung läuft …':'Profil wird erstellt …';showStatus(button.textContent,'wait');
  try{
    var r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:action,username:username,password:password})});
    var j={};try{j=await r.json()}catch(e){}
    if(!r.ok)throw new Error(j.error||('Serverfehler ('+r.status+')'));
    localStorage.setItem(TK,j.token);localStorage.setItem(UK,j.user.username);
    showStatus('✅ Erfolgreich. Das Spiel wird geöffnet …','ok');
    setTimeout(function(){location.href='app-v2.html?v=20260819-1012';},450);
  }catch(e){showStatus('❌ '+(e&&e.message?e.message:'Verbindung fehlgeschlagen.'),'bad');button.disabled=false;button.textContent=old;}
}
document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();call('login',document.getElementById('lu').value.trim(),document.getElementById('lp').value,document.getElementById('loginBtn'));});
document.getElementById('registerForm').addEventListener('submit',function(e){e.preventDefault();var p=document.getElementById('rp').value,p2=document.getElementById('rp2').value;if(p!==p2){showStatus('❌ Die Passwörter stimmen nicht überein.','bad');return;}call('register',document.getElementById('ru').value.trim(),p,document.getElementById('registerBtn'));});
})();
</script>
</body>
</html>
